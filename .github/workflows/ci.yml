name: CI

on:
  pull_request:
  push:
    branches:
      - master

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  infrastructure:
    name: Validate Terraform
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: 1.16.0

      - name: Check Terraform formatting
        run: terraform fmt -check -recursive infra/terraform

      - name: Initialize state bootstrap without a backend
        run: terraform -chdir=infra/terraform/bootstrap init -backend=false

      - name: Validate state bootstrap
        run: terraform -chdir=infra/terraform/bootstrap validate

      - name: Initialize production infrastructure without a backend
        run: terraform -chdir=infra/terraform/production init -backend=false

      - name: Validate production infrastructure
        run: terraform -chdir=infra/terraform/production validate

  verify:
    name: Test, lint, and build
    runs-on: ubuntu-latest
    timeout-minutes: 15

    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: ci_user
          POSTGRES_PASSWORD: ci_password
          POSTGRES_DB: roommate_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ci_user -d roommate_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    defaults:
      run:
        working-directory: roommate

    env:
      DATABASE_URL: postgresql://ci_user:ci_password@127.0.0.1:5432/roommate_ci
      AUTH_SECRET: ci-only-secret-not-used-in-production

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: roommate/package-lock.json

      - name: Install locked dependencies
        run: npm ci

      - name: Audit production and development dependencies
        run: npm run audit:dependencies

      - name: Rebuild schema from committed migrations
        run: npm run db:deploy

      - name: Verify migration status
        run: npm run db:status

      - name: Run unit tests
        run: npm test

      - name: Run database integration tests
        run: npm run test:integration

      - name: Run lint checks
        run: npm run lint

      - name: Create production build
        run: npm run build

  e2e:
    name: Test critical user journeys
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 15

    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: e2e_user
          POSTGRES_PASSWORD: e2e_password
          POSTGRES_DB: roommate_e2e
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U e2e_user -d roommate_e2e"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    defaults:
      run:
        working-directory: roommate

    env:
      CI: "true"
      DATABASE_URL: postgresql://e2e_user:e2e_password@127.0.0.1:5432/roommate_e2e
      AUTH_SECRET: e2e-only-secret-with-at-least-32-characters

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: roommate/package-lock.json

      - name: Install locked dependencies
        run: npm ci

      - name: Rebuild schema from committed migrations
        run: npm run db:deploy

      - name: Install Chromium runtime
        run: npx playwright install --with-deps chromium

      - name: Run browser journeys
        run: npm run test:e2e

  container:
    name: Build deployment image
    needs:
      - verify
      - e2e
    runs-on: ubuntu-latest
    timeout-minutes: 15

    defaults:
      run:
        working-directory: roommate

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Build production container
        run: docker build --tag unitern:ci .
